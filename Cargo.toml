[package]
name = "stack"
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
description = "Reusable, agent-safe development stacks"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "stack"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
toml = { version = "0.8", features = ["preserve_order"] }
ureq = "2"

[dev-dependencies]
tempfile = "3"
