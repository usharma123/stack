version: 2
updates:
  # A release must be at least a week old before Dependabot proposes it (security updates are
  # not delayed), so a compromised release has time to be found and yanked first.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
