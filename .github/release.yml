changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot[bot]
  categories:
    - title: Features
      labels:
        - feat
        - enhancement
    - title: Performance
      labels:
        - perf
    - title: Fixes
      labels:
        - fix
        - bug
    - title: CI & Packaging
      labels:
        - ci
    - title: Other Changes
      labels:
        - "*"
