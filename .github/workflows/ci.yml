name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    permissions:
      contents: read
    uses: $/.github/workflows/validate.yml
  required:
    name: CI passed
    # Superseded runs are cancelled, not validation failures.
    if: ${{ always() && !cancelled() }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: test "$RESULT" = success
        timeout-minutes: 5
        env:
          RESULT: ${{ needs.validate.result }}
