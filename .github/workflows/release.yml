name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: npm-release
  queue: max
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release origin
        run: |
          test "$GITHUB_REPOSITORY" = usharma123/stack
          git merge-base --is-ancestor HEAD origin/main
          # shellcheck disable=SC2016
          node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("npm/package.json")); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("Release tag does not match package version");'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: npm-package
          path: dist
      - name: Publish and verify immutable package
        run: node scripts/publish.mjs dist/*.tgz
      - name: Install from npm registry
        run: |
          version=$(node -p "require('./npm/package.json').version")
          mkdir registry
          npm pack "@ushawarma/stack@$version" --pack-destination registry --registry=https://registry.npmjs.org
          node scripts/smoke-install.mjs registry/*.tgz
