name: Release
on:
  push:
    tags: ['v*']
permissions: {}
concurrency:
  group: npm-release
  queue: max
  cancel-in-progress: false
jobs:
  source:
    name: Select tested main artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # Select and download the tested CI artifact.
    outputs:
      run-id: ${{ steps.source.outputs.run-id }}
      artifact-id: ${{ steps.source.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - name: Check release origin
        timeout-minutes: 1
        run: |
          test "$GITHUB_REPOSITORY" = usharma123/stack
          git merge-base --is-ancestor HEAD origin/main
      - name: Select exact commit's main CI artifact
        timeout-minutes: 3
        id: source
        run: node scripts/promote.mjs select
        env:
          GH_TOKEN: ${{ github.token }}
  # Only this job can obtain an npm publishing identity.
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # Select and download the tested CI artifact.
      id-token: write # npm trusted publishing and provenance.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          artifact-ids: ${{ needs.source.outputs.artifact-id }}
          run-id: ${{ needs.source.outputs.run-id }}
          github-token: ${{ github.token }}
          path: dist
          digest-mismatch: error
      - name: Verify tested package identity and binaries
        timeout-minutes: 1
        run: node scripts/promote.mjs verify dist/*.tgz
      - name: Publish and verify immutable package
        timeout-minutes: 22
        run: node scripts/publish.mjs dist/*.tgz
      - name: Install from npm registry
        timeout-minutes: 6
        run: |
          version=$(node -p "require('./npm/package.json').version")
          mkdir registry
          npm pack "@ushawarma/stack@$version" --pack-destination registry --ignore-scripts --fetch-timeout=30000 --fetch-retries=2 --registry=https://registry.npmjs.org
          node scripts/smoke-install.mjs registry/*.tgz
  # Create or update the GitHub Release only after npm publication succeeds.
  # Keeps `contents: write` separate from the `publish` job's npm OIDC identity.
  github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [source, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Create/update the GitHub Release and upload assets.
      actions: read # Download the exact tested CI artifact.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          artifact-ids: ${{ needs.source.outputs.artifact-id }}
          run-id: ${{ needs.source.outputs.run-id }}
          github-token: ${{ github.token }}
          path: dist
          digest-mismatch: error
      - name: Verify tested package identity and binaries
        timeout-minutes: 1
        run: node scripts/promote.mjs verify dist/*.tgz
      - name: Prepare release notes and checksummed assets
        id: notes
        timeout-minutes: 2
        run: node scripts/release-notes.mjs dist/*.tgz release-assets
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create or update GitHub Release
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TITLE: ${{ steps.notes.outputs.title }}
          RELEASE_PRERELEASE: ${{ steps.notes.outputs.prerelease }}
          RELEASE_ASSET: ${{ steps.notes.outputs.asset }}
          RELEASE_SUMS: ${{ steps.notes.outputs.sums }}
          RELEASE_NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES"
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" "$RELEASE_SUMS" --clobber
          else
            args=(--title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES" --verify-tag)
            if [ "$RELEASE_PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "$RELEASE_ASSET" "$RELEASE_SUMS" "${args[@]}"
          fi
