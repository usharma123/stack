name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: npm-release
  queue: max
  cancel-in-progress: false
jobs:
  source:
    name: Select tested main artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run-id: ${{ steps.source.outputs.run-id }}
      artifact-id: ${{ steps.source.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - name: Check release origin
        run: |
          test "$GITHUB_REPOSITORY" = usharma123/stack
          git merge-base --is-ancestor HEAD origin/main
      - name: Select exact commit's main CI artifact
        id: source
        run: node scripts/promote.mjs select
        env:
          GH_TOKEN: ${{ github.token }}
  # Only this job can obtain an npm publishing identity.
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.source.outputs.artifact-id }}
          run-id: ${{ needs.source.outputs.run-id }}
          github-token: ${{ github.token }}
          path: dist
          digest-mismatch: error
      - name: Verify tested package identity and binaries
        run: node scripts/promote.mjs verify dist/*.tgz
      - name: Publish and verify immutable package
        timeout-minutes: 22
        run: node scripts/publish.mjs dist/*.tgz
      - name: Install from npm registry
        run: |
          version=$(node -p "require('./npm/package.json').version")
          mkdir registry
          npm pack "@ushawarma/stack@$version" --pack-destination registry --registry=https://registry.npmjs.org
          node scripts/smoke-install.mjs registry/*.tgz
