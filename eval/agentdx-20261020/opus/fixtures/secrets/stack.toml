# Webhook signer: the task signs a payload with a fake key granted from fnox.
[tools]
python = "3.13"
fnox = "1.39.0"

[tasks.sign]
run = "python3 sign.py"
secrets = ["WEBHOOK_KEY"]

[tasks.leaky]
run = "python3 -c 'import os,base64;print(os.environ.get(\"WEBHOOK_KEY\"));print(base64.b64encode(os.environ[\"WEBHOOK_KEY\"].encode()).decode());print(os.environ.get(\"OTHER_KEY\",\"other-unset\"))'"
secrets = ["WEBHOOK_KEY"]
