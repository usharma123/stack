# Benchmark-owned service glue for workz (scripted): workz 0.11.0 names the Compose project,
# the database and the port range in .env.local, but declares no services itself.
# Images are digest-pinned; data lives in project-scoped named volumes.
services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: ${DB_NAME:?run rwb-workz-env.sh first}
    ports: ["127.0.0.1:${PORT:?}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "PGPASSWORD=bench psql -h 127.0.0.1 -U bench -d \"$$POSTGRES_DB\" -Atc 'select 1' >/dev/null"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 120s
      start_interval: 1s
  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command: [redis-server, --appendonly, "yes", --appendfsync, always]
    ports: ["127.0.0.1:${REDIS_PORT:?}:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: [CMD-SHELL, "redis-cli ping | grep -qx PONG"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 120s
      start_interval: 1s
volumes:
  pgdata: {}
  redisdata: {}
