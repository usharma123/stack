[project]
name = "invoice-ledger"
version = "0.2.0"
requires-python = ">=3.13,<3.14"
dependencies = ["psycopg[binary]==3.3.6", "redis==5.3.1"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
python-downloads = "never"
python-preference = "only-system"
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
