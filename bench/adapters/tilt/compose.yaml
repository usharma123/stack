# Tilt's Compose backend configuration. Image references are digest-pinned (research/tilt.md,
# research/compose.md). No host ports: each checkout's project has its own network and DNS.
# RWB_* values come from the checkout's uncommitted tilt.local.env.
services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    labels:
      rwb.run: ${RWB_RUN:?set RWB_RUN}
      rwb.service: "1"
    healthcheck:
      # TCP probe: the image's init phase listens only on the Unix socket.
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 60
  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command: [redis-server, --dir, /data, --appendonly, "yes", --appendfsync, always]
    volumes:
      - redisdata:/data
    labels:
      rwb.run: ${RWB_RUN:?set RWB_RUN}
      rwb.service: "1"
    healthcheck:
      test: [CMD-SHELL, "redis-cli ping | grep -qx PONG"]
      interval: 1s
      timeout: 3s
      retries: 60
  app:
    # Toolchain container (pinned Python 3.13 + uv). The checkout is bind-mounted at its own
    # absolute path so the app runs this checkout's source; .venv lives in the checkout.
    image: ${RWB_PROJECT:?set RWB_PROJECT}-app
    build: .
    init: true
    command: [sleep, infinity]
    working_dir: ${RWB_SRC:?set RWB_SRC}
    environment:
      DATABASE_URL: postgresql://postgres:bench@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/0
      UV_CACHE_DIR: /uv-cache
      UV_LINK_MODE: copy
      UV_PYTHON_DOWNLOADS: never
    volumes:
      - type: bind
        source: ${RWB_SRC:?set RWB_SRC}
        target: ${RWB_SRC:?set RWB_SRC}
      - type: bind
        source: ${RWB_UV_CACHE:?set RWB_UV_CACHE}
        target: /uv-cache
    labels:
      rwb.run: ${RWB_RUN:?set RWB_RUN}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  pgdata: {}
  redisdata: {}
